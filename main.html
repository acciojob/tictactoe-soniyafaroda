<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
    }

    .container {
      width: 350px;
      padding: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    #board {
      display: none;
      margin-top: 20px;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 5px;
      justify-content: center;
      margin-top: 20px;
    }

    .cell {
      width: 100px;
      height: 100px;
      background: #e3e3e3;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      cursor: pointer;
      border-radius: 5px;
    }

    .message {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
      height: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="input-section">
      <h2>Enter Player Names</h2>
      <input id="player-1" type="text" placeholder="Player 1 Name" />
      <br /><br />
      <input id="player-2" type="text" placeholder="Player 2 Name" />
      <br /><br />
      <button id="submit">Submit</button>
    </div>

    <div id="board">
      <h1>Tic Tac Toe</h1>
      <div class="message"></div>
      <div class="board-grid" id="cells"></div>
    </div>
  </div>

  <script>
    const submitBtn = document.getElementById('submit');
    const board = document.getElementById('board');
    const message = document.querySelector('.message');
    const cellsContainer = document.getElementById('cells');

    let player1 = '';
    let player2 = '';
    let currentPlayer = '';
    let currentSymbol = 'X';
    let gameActive = true;
    let boardState = Array(9).fill('');

    // Create Cells
    for (let i = 1; i <= 9; i++) {
      const cell = document.createElement('div');
      cell.classList.add('cell');
      cell.id = i;
      cell.addEventListener('click', () => handleCellClick(i));
      cellsContainer.appendChild(cell);
    }

    submitBtn.addEventListener('click', () => {
      player1 = document.getElementById('player-1').value.trim();
      player2 = document.getElementById('player-2').value.trim();

      if (!player1 || !player2) {
        alert('Please enter both player names.');
        return;
      }

      document.getElementById('input-section').style.display = 'none';
      board.style.display = 'block';

      currentPlayer = player1;
      currentSymbol = 'X';
      message.textContent = `${currentPlayer}, you're up`;
    });

    function handleCellClick(id) {
      if (!gameActive) return;

      const cell = document.getElementById(id);
      if (cell.textContent !== '') return;

      const index = id - 1;
      boardState[index] = currentSymbol;
      cell.textContent = currentSymbol;

      if (checkWin()) {
        message.textContent = `${currentPlayer}, congratulations you won!`;
        gameActive = false;
        return;
      }

      switchPlayer();
    }

    function switchPlayer() {
      if (currentPlayer === player1) {
        currentPlayer = player2;
        currentSymbol = 'O';
      } else {
        currentPlayer = player1;
        currentSymbol = 'X';
      }
      message.textContent = `${currentPlayer}, you're up`;
    }

    function checkWin() {
      const wins = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];

      return wins.some(pattern => {
        const [a,b,c] = pattern;
        return boardState[a] && boardState[a] === boardState[b] && boardState[b] === boardState[c];
      });
    }
  </script>
</body>
</html>
